name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the deploy job widens it below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy the built site to GitHub Pages — only on pushes to main, and only
  # once opted in. To enable: set Settings > Pages > Source to "GitHub Actions",
  # then add a repository variable DEPLOY_PAGES = true. Until then this job is
  # skipped (green), so CI runs without a red deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
